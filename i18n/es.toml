other = "Soy investigadora posdoctoral en el Centro de Excelencia en IA Generativa (CoE GenAI) de la Universidad de Ciencia y Tecnología Rey Abdalá (KAUST), Arabia Saudita. Mi investigación se centra en la IA para la ciencia, incluida la visión por computador, la comprensión de video, el aprendizaje automático con preservación de la privacidad y las aplicaciones en salud."

