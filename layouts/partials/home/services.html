<div class="col-xs-12">
  <h3>Talks & Videos</h3>

  <div class="row">
    {{ $talks := first 3 (where .Site.RegularPages "Section" "talks") }}

    {{ range $talks }}
      <div class="col-sm-4">
        <a href="{{ .RelPermalink }}">

          {{ if .Params.youtube_id }}
            <img src="https://img.youtube.com/vi/{{ .Params.youtube_id }}/hqdefault.jpg"
                 style="width:100%; margin-bottom:10px;">

          {{ else if .Params.thumbnail }}
            <img src="{{ .Params.thumbnail }}"
                 style="width:100%; margin-bottom:10px;">

          {{ end }}

        </a>

        <p style="font-weight:bold; margin-bottom:5px;">
          {{ .Title }}
        </p>
      </div>
    {{ end }}
  </div>

  <p style="margin-top:15px;">
    <a href="/talks/">View all... &rarr;</a>
  </p>
</div>
