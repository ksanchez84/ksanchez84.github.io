<header id="header">

<div id="head" class="hero">
    <div class="hero-container">
        <div class="hero-photo">
            <img src="{{ relURL .Site.Params.avatar }}" alt="">
        </div>
        <div class="hero-content">
            <h1>{{ .Site.Params.name }}</h1>
            <p class="hero-tagline">
               {{ i18n "hero_tagline" }}
            </p>
            <p>
              {{ i18n "hero_bio" }}
            </p>

            <ul class="social-buttons">
                {{ range where .Site.Params.social "header" true }}
                <li>
                    <a href="{{ .url }}" title="{{ .title }}" aria-label="{{ .title }}" target="_blank" rel="noopener noreferrer">
                        <i class="{{ .icon }}"></i>
                    </a>
                </li>
                {{ end }}
                <li>
                    <a href="https://scholar.google.com/citations?user=k7sOz3kAAAAJ&amp;hl={{ .Lang }}&amp;oi=ao"
                       title="Google Scholar"
                       aria-label="Google Scholar"
                       target="_blank"
                       rel="noopener noreferrer">
                        <i class="fas fa-graduation-cap"></i>
                    </a>
                </li>
            </ul>
            <div class="hero-buttons">
              <a href="{{ "about/" | relLangURL }}" class="btn-primary-custom">
                <i class="fa fa-file-text-o"></i> {{ i18n "about_cv_button" }}
              </a>
            </div>
        </div>
    </div>
</div>
{{ partial "head/menu.html" . }}
</header>
